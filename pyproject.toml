[tool.ruff]
target-version = "py312"
line-length = 80
# Автогенерированные миграции Alembic не линтуем (длинные comment-строки и т.п.)
exclude = [
    ".git",
    ".venv",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes — неиспользуемые импорты, undefined names
    "I",    # isort — порядок импортов
    "B",    # flake8-bugbear — мутабельные дефолты, голые except и т.д.
    "UP",   # pyupgrade — актуальный синтаксис Python 3.12+
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]
ignore = [
    # Ambiguous unicode: кириллица (а, е, о, с...) визуально похожа на латиницу.
    # У нас проект на русском — эти правила дают сплошные ложные срабатывания.
    "RUF001",  # в строках
    "RUF002",  # в докстрингах
    "RUF003",  # в комментариях
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
